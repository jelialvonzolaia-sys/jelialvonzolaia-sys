  </text>
  <text x="68" y="104" fill="#1E2952" font-family="Poppins, Segoe UI, sans-serif" font-size="21" font-weight="800">
    Halo! Saya Jeli Alvonzo Laia
  </text>

  
  <g fill="#2D3748" font-family="Poppins, Segoe UI, sans-serif" font-size="12.2" font-weight="500">
    <text x="68" y="132">Mahasiswa S1 <tspan fill="#1E2952" font-weight="700">Teknologi Informasi</tspan> di Fakultas Ilmu</text>
    <text x="68" y="151">Komputer dan Teknologi Informasi (<tspan fill="#2E3B7E" font-weight="700">Fasilkom-TI USU</tspan>).</text>

    <text x="68" y="180">Berfokus pada pengembangan aplikasi web <tspan fill="#108A68" font-weight="700">Full-Stack</tspan></text>
    <text x="68" y="199">berbasis <tspan fill="#D94E34" font-weight="700">Laravel</tspan>, basis data <tspan fill="#1E2952" font-weight="700">MySQL &amp; PostgreSQL</tspan>,</text>
    <text x="68" y="218">rekayasa <tspan fill="#2E3B7E" font-weight="700">Semantic Web (RDF/SPARQL)</tspan>, serta desain</text>
    <text x="68" y="237">antarmuka modern yang bersih dan responsif.</text>
  </g>

  
